<!DOCTYPE html>
<html>

<head>

    <title>Result</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <h1>🎧 Emotion Detected</h1>

        <div class="result">

            Your mood is:
            <strong>{{ emotion }}</strong>

        </div>

        <h2>Recommended Songs</h2>

        <ul>

            {% for song in songs %}

            <li>{{ song }}</li>

            {% endfor %}

        </ul>

        <br>

        <a href="/">⬅ Go Back</a>

    </div>

</body>

</html>
